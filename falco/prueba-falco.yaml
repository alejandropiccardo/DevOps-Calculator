# Pod que dispara la regla "Herramienta de red ejecutada en contenedor" de
# falco/values.yaml. No abre ningun shell: el comando del contenedor es wget.
# Cumple las 4 politicas de Kyverno, asi que se admite.
#
#   kubectl apply -f falco/prueba-falco.yaml
#   kubectl -n falco logs ds/falco -c falco | grep "Herramienta de red"
apiVersion: v1
kind: Pod
metadata:
  name: prueba-falco
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: calculadora:2.2
      imagePullPolicy: IfNotPresent
      command: ["wget", "-q", "-T", "3", "-O", "/dev/null", "http://example.com"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 128Mi }
