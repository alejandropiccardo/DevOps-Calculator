# Pod que dispara la regla estandar de Falco "Search Private Keys or Passwords".
# Simula a un atacante buscando claves privadas dentro del contenedor. No abre
# ningun shell: el comando del contenedor es directamente find.
# Cumple las 4 politicas de Kyverno, asi que se admite.
#
#   kubectl apply -f falco/prueba-falco.yaml
#   kubectl -n falco logs ds/falco -c falco | grep "Search Private Keys"
apiVersion: v1
kind: Pod
metadata:
  name: prueba-falco
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: calculadora:2.2
      imagePullPolicy: IfNotPresent
      command: ["find", "/etc", "-name", "id_rsa"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 128Mi }
