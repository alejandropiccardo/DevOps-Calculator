# Entorno BLUE: version 1.0 de la calculadora (sin raiz cuadrada).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-blue
  labels:
    app: calculadora
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculadora
      version: blue
  template:
    metadata:
      labels:
        app: calculadora
        version: blue
      annotations:
        # Prometheus descubre los pods por estas anotaciones (ver prometheus.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: calculadora
          image: calculadora:1.1
          # La imagen se carga a mano en minikube, nunca se busca en un registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: calc-config-blue
          # El Service solo enruta trafico a los pods que pasan la readiness.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
