name: Build y push a DockerHub

# Se dispara con cada push a la branch entrega2.
# workflow_dispatch permite ademas lanzarlo a mano desde la pestania Actions.
on:
  push:
    branches: [ entrega2 ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Las dos versiones se construyen en paralelo, cada una con su tag.
    # Agregar una version futura = agregar una entrada mas a esta lista.
    strategy:
      matrix:
        include:
          - path: app/v1
            tag: "1.0"
          - path: app/v2
            tag: "2.0"

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # build-push-action necesita Buildx para funcionar.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de calculadora:${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/calculadora:${{ matrix.tag }}
