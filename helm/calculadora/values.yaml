nombreApp: calculadora

imagen:
  # El cluster de la UCU baja la imagen de un registry publico: ya no sirve
  # "minikube image load".
  repositorio: alepiccardo/calculadora
  pullPolicy: IfNotPresent

# A que entorno apunta el Service. Cambiarlo es TODO el despliegue blue/green:
#   helm upgrade calculadora ./helm/calculadora --set entornoActivo=green
entornoActivo: blue

# Los dos entornos conviven en el cluster.
#
# tag y appVersion de aca son SOLO el default para un "helm install" a mano. En
# el pipeline los dos salen de VERSION_V1/VERSION_V2 del Jenkinsfile, que es la
# unica fuente de verdad:
#
#   tag        -> 1.2-a1b2c3d   la imagen que corre (trazable al commit)
#   appVersion -> 1.2           lo que la app reporta por la API
#
# Al salir ambos del mismo valor no se pueden desincronizar, que era el riesgo:
# que la imagen dijera 2.3 y la API siguiera respondiendo "version":"2.2".
entornos:
  blue:
    tag: "1.2"
    appVersion: "1.2"
    replicas: 2
  green:
    tag: "2.2"
    appVersion: "2.2"
    replicas: 2

# Con la cuota al limite, un maxSurge > 0 no puede crear el pod nuevo y el
# rollout se traba. Con maxSurge 0 se libera un pod primero y despues se crea
# el reemplazo: nunca necesita cuota extra. Cuesta tener 1 replica por unos
# segundos durante la actualizacion.
estrategia:
  maxSurge: 0
  maxUnavailable: 1

service:
  # ClusterIP por defecto: el cluster de la UCU es compartido entre grupos y un
  # nodePort fijo chocaria con otro equipo. Para acceder se usa port-forward.
  tipo: ClusterIP
  puerto: 80
  puertoDestino: 8000
  # nodePort: 30080   # solo tiene efecto si tipo es NodePort

# Expone la app con un hostname propio por el gateway APISIX del cluster de la
# UCU. *.reto-ucu.net es un DNS wildcard que apunta al gateway, asi que no hay
# que registrar nada: alcanza con elegir un host libre.
#
# Esta es la forma correcta de exponer en un cluster compartido entre grupos:
# el hostname los distingue sobre el 443 comun, sin reservar un nodePort global.
ingress:
  habilitado: true
  clase: apisix
  host: calculadora-grupo5.reto-ucu.net
  ruta: /
  tipoRuta: Prefix
  anotaciones: {}

# El namespace tiene una ResourceQuota (student-quota) que topea requests.cpu
# en 200m para TODO el namespace. Con 4 pods a 50m se llenaba exacto y ningun
# rolling update podia arrancar: para crear el pod nuevo hace falta cuota libre.
# 25m es ademas el default del LimitRange del namespace.
recursos:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Anotaciones para que Prometheus descubra los pods (ver monitoring/prometheus.yaml).
metricas:
  habilitadas: true
  puerto: "8000"
  ruta: /metrics

sondas:
  ruta: /health
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

# Valores exigidos por las politicas de Kyverno (kyverno/politicas/).
seguridad:
  runAsUser: 10001
  runAsGroup: 10001
